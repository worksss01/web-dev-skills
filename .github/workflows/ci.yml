name: Validate skill and packages
on:
  push:
    branches: [main, 'feature/**', 'maintenance/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Unit tests and committed manifest
        run: node tools/check.mjs
      - name: Installer and portable knowledge ledger
        run: node tests/package-smoke.mjs --work work/ci-package
      - name: Build all variants
        run: python tools/package.py --out work/ci-build
      - name: Browser evaluation controls
        if: matrix.node == '24'
        run: node tools/evaluate.mjs self-test --out work/ci-evals
      - name: Pull pinned isolated lab runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: docker pull node@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
      - name: Isolated lab canary
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: python tools/lab-smoke.py --out work/ci-lab.json
